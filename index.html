  <style>/* このページ内の要素に適用する、色・文字サイズ・配置などの指定。 */
    body { min-height: 100vh; display: flex; flex-direction: column; }
    /* ── ポータルヒーロー（共通 .hero より少し大きめのパディング） ── */
    .portal-hero { padding: 56px 24px 52px; }
    .portal-hero h1 { font-size: 2.2rem; letter-spacing: .06em; }
    /* ── カードグリッド ── */
    .portal-main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 2.8rem 1.5rem 4rem;
    }
    .section-label {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: #999;
      text-transform: uppercase;
      margin: 0 0 1.2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }
    a.card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 36px 20px 28px;
      text-decoration: none;
      color: #333;
      box-shadow: var(--shadow-sm);
      border-top: 4px solid var(--primary);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    a.card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
      text-decoration: none;
    }
    .card .icon { font-size: 2.4rem; margin-bottom: 14px; }
    .card .title { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .card .sub { font-size: 0.78rem; color: #999; margin-top: 5px; }
    @media (max-width: 640px) {
      .portal-hero { padding: 32px 16px 28px; }
      .portal-hero h1 { font-size: 1.5rem; letter-spacing: .02em; }
      .portal-main { padding: 1.5rem 1rem 2.5rem; }
      .grid { gap: 12px; }
      a.card { padding: 24px 16px 20px; }
      .card .icon { font-size: 2rem; margin-bottom: 10px; }
    }
  </style>
</head>
